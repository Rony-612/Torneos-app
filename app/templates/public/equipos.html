{% extends "public/base.html" %}
{% block title %}Equipos{% endblock %}
{% block content %}
<h1 class="font-display text-3xl font-bold text-navy mb-8">Equipos</h1>
<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
  {% for e in equipos %}
    <a href="{{ url_for('public.equipo_detalle', equipo_id=e.id) }}" class="card-hover bg-white rounded-xl shadow-card border border-gray-100 p-6 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-gradient-to-br from-navy to-navy-light flex items-center justify-center text-white font-display font-bold flex-shrink-0">
        {{ e.nombre[:2].upper() }}
      </div>
      <p class="font-semibold text-navy">{{ e.nombre }}</p>
    </a>
  {% else %}
    <p class="text-gray-400">Aún no hay equipos registrados.</p>
  {% endfor %}
</div>
{% endblock %}

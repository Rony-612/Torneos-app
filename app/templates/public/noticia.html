{% extends "public/base.html" %}
{% block title %}{{ noticia.titulo }}{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow-card border border-gray-100 p-8 max-w-2xl">
  <h1 class="font-display text-2xl font-bold text-navy">{{ noticia.titulo }}</h1>
  <p class="text-xs text-gray-500 mt-2">{{ noticia.fecha_publicacion.strftime('%d/%m/%Y') }}</p>
  <p class="text-gray-700 mt-5 leading-relaxed">{{ noticia.contenido }}</p>
</div>
{% endblock %}
